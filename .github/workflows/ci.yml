name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ --select E,F,W --ignore E501
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_ibkr.py
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: dummy
          TELEGRAM_CHAT_ID: dummy
          ALPACA_API_KEY: dummy
          ALPACA_SECRET_KEY: dummy

  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - name: ruff
        run: ruff check src/ --select E,F --ignore E501
        continue-on-error: true
      - name: black (check only)
        run: black --check src/ --line-length 100
        continue-on-error: true
